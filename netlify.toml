# Tells Netlify how to build this Next.js site.
# Netlify adds its Next.js runtime automatically, which also runs the contact-form API route.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Netlify's Next.js runtime: turns pages into a site and the contact-form route into a function
[[plugins]]
  package = "@netlify/plugin-nextjs"
