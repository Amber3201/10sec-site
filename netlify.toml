# Tells Netlify how to build this Next.js site.
# Netlify adds its Next.js runtime automatically, which also runs the contact-form API route.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Netlify's Next.js runtime: turns pages into a site and the contact-form route into a function
[[plugins]]
  package = "@netlify/plugin-nextjs"

# One-hop 301s to the canonical https://10sec.space, so no URL goes through a redirect chain
# (e.g. http://www → https://www → https://apex). Netlify already sends http://10sec.space → https.
[[redirects]]
  from = "http://www.10sec.space/*"
  to = "https://10sec.space/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.10sec.space/*"
  to = "https://10sec.space/:splat"
  status = 301
  force = true

# Long cache for the concept-site fonts and libraries (moved out of the HTML to keep pages light)
[[headers]]
  for = "/concepts/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
